<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات البريد والإشعارات</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border: none; border-radius: 12px; }
        .card-header { background-color: #fff; border-bottom: 1px solid #edf2f7; border-radius: 12px 12px 0 0 !important; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header p-4">
                    <h4 class="card-title mb-0 fw-bold text-primary">⚙️ إعدادات الإشعارات والـ Gmail</h4>
                </div>
                <div class="card-body p-4">
                    
                    <!-- 1. ربط حساب Gmail -->
                    <div class="mb-4 pb-4 border-bottom">
                        <label class="form-label fw-bold h6">1. حساب الإرسال (Gmail Authentication)</label>
                        <p class="text-muted small">ربط حساب الـ Gmail الخاص بك ليقوم النظام بإرسال إشعارات الحجز تلقائيًا منه.</p>
                        
                        <div class="mt-3">
                            <a href="/api/gmail/connect" class="btn btn-outline-primary d-inline-flex align-items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-google" viewBox="0 0 16 16">
                                    <path d="M15.545 6.558a9.42 9.42 0 0 0 .139-1.626c0-.72-.086-1.425-.243-2.102H7.9v3.972h4.357a3.722 3.722 0 0 1-1.614 2.441v2.032h2.615c1.53-1.408 2.413-3.483 2.413-5.715z"/>
                                    <path d="M7.9 16c2.163 0 3.978-.716 5.304-1.942l-2.615-2.032c-.717.481-1.637.766-2.689.766-2.072 0-3.83-1.398-4.457-3.284H.813v2.091A7.997 7.997 0 0 0 7.9 16z"/>
                                    <path d="M3.443 9.508a4.802 4.802 0 0 1 0-3.016V4.401H.813a7.997 7.997 0 0 0 0 7.198l2.63-2.091z"/>
                                    <path d="M7.9 3.208c1.176 0 2.235.405 3.067 1.202l2.302-2.302C11.873.801 10.058 0 7.9 0A7.997 7.997 0 0 0 .813 4.401l2.63 2.091C4.07 4.606 5.828 3.208 7.9 3.208z"/>
                                </svg>
                                ربط حساب Gmail للإرسال
                            </a>
                        </div>
                    </div>

                    <!-- 2. إيميل استقبال الحجوزات -->
                    <div class="mb-3">
                        <label for="recipientEmail" class="form-label fw-bold h6">2. إيميل استقبال الحجوزات</label>
                        <p class="text-muted small">هذا هو البريد الذي ستصلك عليه تفاصيل وإشعارات الحجوزات الجديدة.</p>
                        
                        <input 
                            type="email" 
                            id="recipientEmail" 
                            class="form-control form-control-lg" 
                            placeholder="example@gmail.com" 
                        />
                        
                        <button onclick="saveRecipientEmail()" class="btn btn-success btn-lg mt-3 w-100">
                            حفظ إيميل المستلم
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
async function saveRecipientEmail() {
  const emailInput = document.getElementById('recipientEmail').value;
  
  if (!emailInput) {
    alert("برجاء إدخال البريد الإلكتروني أولاً.");
    return;
  }

  try {
    const res = await fetch('/api/gmail/save-recipient', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: emailInput })
    });
    
    const data = await res.json();
    if (data.success) {
      alert("✅ تم حفظ إيميل المستلم بنجاح!");
    } else {
      alert("❌ حدث خطأ: " + data.message);
    }
  } catch (err) {
    console.error(err);
    alert("❌ فشل الاتصال بالخادم.");
  }
}
</script>

</body>
</html>
